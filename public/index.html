<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#131921">
<title>343SHOP — Online Shopping & Brokerage</title>
<link rel="stylesheet" href="/amazon-skin.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#eaeded;font-family:Arial,Helvetica,sans-serif;color:#0f1111}
.top{background:#131921;color:#fff;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{font-weight:900;font-size:22px;color:#fff;text-decoration:none}.logo span{color:#febd69}
.searchbox{flex:1;min-width:200px;display:flex;background:#fff;border-radius:8px;overflow:hidden;border:2px solid #febd69}
.searchbox input{flex:1;border:0;padding:12px;font-size:14px;outline:none}
.searchbox button{background:#febd69;border:0;padding:0 18px;font-weight:700;cursor:pointer}
.nav2{background:#232f3e;color:#fff;padding:8px 16px;display:flex;gap:16px;flex-wrap:wrap;font-size:13px}
.nav2 a{color:#fff;text-decoration:none}.nav2 a:hover{color:#febd69;text-decoration:underline}
.wrap{width:min(1200px,calc(100% - 24px));margin:16px auto}
.banner{background:#fff;padding:20px;border:1px solid #d5d9d9;border-radius:4px;margin-bottom:16px}
.banner h1{margin:0 0 8px;font-size:28px}.banner p{margin:0;color:#565959}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:#fff;border:1px solid #d5d9d9;border-radius:4px;padding:12px;display:flex;flex-direction:column;gap:8px}
.card img{width:100%;height:180px;object-fit:contain;background:#fff}
.card h3{font-size:14px;font-weight:500;margin:0;min-height:40px;line-height:1.3}
.price{font-size:18px;font-weight:700}
.btn{background:#ffd814;border:1px solid #fcd200;border-radius:20px;padding:10px 14px;font-weight:700;cursor:pointer;text-align:center;color:#0f1111;text-decoration:none;display:inline-block}
.btn:hover{background:#f7ca00}
.cart{background:#febd69;color:#0f1111;border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}
.footer{background:#232f3e;color:#ddd;padding:28px 16px;margin-top:40px;font-size:13px}
.footer a{color:#febd69}
</style>
</head>
<body>
<div class="top">
  <a class="logo" href="/">343<span>SHOP</span></a>
  <form class="searchbox" action="/#shop" method="get" id="searchForm">
    <input id="q" name="q" type="search" placeholder="Tafuta bidhaa... Search 343SHOP" aria-label="Search">
    <button type="submit">Search</button>
  </form>
  <button class="cart" type="button" id="cartBtn">Cart (<span id="cartCount">0</span>)</button>
</div>
<div class="nav2">
  <a href="/#shop">All</a>
  <a href="/deals.html">Deals</a>
  <a href="/gift-cards.html">Gift Cards</a>
  <a href="/#about">How it works</a>
  <a href="/admin.html">Owner</a>
</div>
<div class="wrap">
  <div class="banner">
    <h1>Karibu 343SHOP</h1>
    <p>Global shopping & brokerage — order via WhatsApp. Muonekano kama Amazon, huduma ya 343SHOP.</p>
  </div>
  <div class="grid" id="products"></div>
</div>
<div class="footer">
  <div class="wrap">
    <strong>343SHOP</strong> — brokerage marketplace. Orders via WhatsApp. No card payments on this site.
    <p><a href="/privacy.html">Privacy</a></p>
  </div>
</div>
<script>
const WHATSAPP_NUMBER="255695981035";
const PRODUCTS=[
  {slug:"book-1",en:"343 Original Book 1",sw:"Kitabu cha 343 Original 1",price:15,img:""},
  {slug:"book-2",en:"343 Original Book 2",sw:"Kitabu cha 343 Original 2",price:18,img:""},
  {slug:"book-3",en:"343 Original Book 3",sw:"Kitabu cha 343 Original 3",price:20,img:""}
];
let cart=JSON.parse(localStorage.getItem("343shop-cart")||"{}");
function save(){localStorage.setItem("343shop-cart",JSON.stringify(cart));document.getElementById("cartCount").textContent=Object.values(cart).reduce((a,n)=>a+n,0)}
function money(n){return "$"+Number(n).toFixed(2)}
function render(){
  const q=(document.getElementById("q").value||"").toLowerCase();
  const list=PRODUCTS.filter(p=>!q||p.en.toLowerCase().includes(q)||p.sw.toLowerCase().includes(q));
  document.getElementById("products").innerHTML=list.map(p=>`
    <div class="card">
      <div style="height:180px;background:#f7f7f7;display:grid;place-items:center;font-size:48px">📘</div>
      <h3>${p.sw} / ${p.en}</h3>
      <div class="price">${money(p.price)}</div>
      <button class="btn" type="button" data-slug="${p.slug}">Add to cart</button>
    </div>`).join("")||"<p>No products match.</p>";
  document.querySelectorAll("[data-slug]").forEach(b=>b.onclick=()=>{cart[b.dataset.slug]=(cart[b.dataset.slug]||0)+1;save();alert("Added to cart");});
}
document.getElementById("searchForm").onsubmit=e=>{e.preventDefault();render()};
document.getElementById("cartBtn").onclick=()=>{
  const items=Object.entries(cart).filter(([,n])=>n>0).map(([k,n])=>{
    const p=PRODUCTS.find(x=>x.slug===k);return p?`• ${p.en} x${n} — ${money(p.price*n)}`:"";
  }).filter(Boolean);
  if(!items.length){alert("Cart is empty");return}
  const msg=["*343SHOP ORDER*",...items,"","Please confirm total & delivery."].join("\n");
  window.open("https://wa.me/"+WHATSAPP_NUMBER+"?text="+encodeURIComponent(msg),"_blank");
};
save();render();
</script>
</body>
</html>
